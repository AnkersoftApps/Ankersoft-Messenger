<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ankersoft™ Messenger</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #21262d;
      --border: #30363d;
      --accent: #2f81f7;
      --accent-hover: #388bfd;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --online: #3fb950;
      --offline: #6e7681;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s;
      min-height: 42px;
    }

    button:hover,
    button:focus {
      background: var(--accent-hover);
      outline: 2px solid #79c0ff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    button.secondary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    button.secondary:hover {
      background: #2d333b;
    }

    input {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
      min-height: 42px;
    }

    input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }

    .auth-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: var(--accent);
    }

    .auth-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
    }

    .auth-tabs button {
      flex: 1;
    }

    #auth-error {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      line-height: 1.4;
    }

    #auth-error.info {
      color: var(--text-muted);
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--danger);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      max-width: 90vw;
      z-index: 50;
      display: none;
    }

    #app-screen {
      display: none;
      height: 100%;
      width: 100%;
    }

    .layout {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .sidebar {
      width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-badge {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .section-label {
      padding: 10px 16px 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .contact-item:hover,
    .contact-item.active {
      background: var(--bg-card);
      border-color: var(--border);
    }

    .contact-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--offline);
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--online);
      box-shadow: 0 0 8px var(--online);
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      min-width: 0;
    }

    .chat-header {
      padding: 14px 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 65px;
    }

    .back-btn {
      display: none;
      padding: 8px 12px;
    }

    .messages-feed {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      margin: auto;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .msg-mine {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-theirs {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: right;
    }

    .msg-media img,
    .msg-media video {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }

    .msg-media audio {
      margin-top: 6px;
      max-width: 240px;
      height: 38px;
    }

    .emoji-bar {
      display: none;
      padding: 8px 14px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }

    .emoji-bar.open {
      display: flex;
    }

    .emoji-btn {
      background: var(--bg-card);
      padding: 6px 10px;
      font-size: 20px;
      min-height: 38px;
    }

    .composer {
      padding: 12px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      padding: 10px 12px;
      font-size: 18px;
      flex-shrink: 0;
    }

    #record-btn.recording {
      background: var(--danger);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.6;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
      }

      .chat-area {
        display: none;
        width: 100%;
      }

      .layout.in-chat .sidebar {
        display: none;
      }

      .layout.in-chat .chat-area {
        display: flex;
      }

      .back-btn {
        display: inline-block;
      }
    }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-box">
      <div class="brand-title">Ankersoft<span>&trade;</span> Messenger</div>
      <div class="auth-sub">Cross-device messaging for Web, iPad &amp; Xbox</div>
      <div class="auth-tabs">
        <button id="tab-login" type="button">Log In</button>
        <button id="tab-signup" class="secondary" type="button">Sign Up</button>
      </div>
      <input type="text" id="auth-username" placeholder="Username (e.g. Ruzaib)" autocomplete="username" autocapitalize="none" spellcheck="false" />
      <input type="password" id="auth-password" placeholder="Password (min 6 characters)" autocomplete="current-password" />
      <button id="auth-submit" type="button">Log In</button>
      <div id="auth-error"></div>
    </div>
  </div>

  <div id="toast" role="alert"></div>

  <div id="app-screen">
    <div class="layout" id="main-layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <div>
            <div style="font-weight: 800; font-size: 17px;">Ankersoft&trade;</div>
            <div class="user-badge" id="current-user-label">@user</div>
          </div>
          <button id="logout-btn" class="secondary" style="padding: 6px 12px; font-size: 13px;" type="button">Log Out</button>
        </div>

        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search username to add..." />
        </div>

        <div id="search-results-section" style="display:none;">
          <div class="section-label">Search Results</div>
          <div class="list-container" id="search-results-list" style="max-height: 160px;"></div>
        </div>

        <div class="section-label">Contacts</div>
        <div class="list-container" id="contacts-list"></div>
      </div>

      <div class="chat-area">
        <div class="chat-header">
          <div style="display:flex; align-items:center; gap:10px;">
            <button id="back-btn" class="secondary back-btn" type="button">&larr; Contacts</button>
            <span class="status-dot" id="active-chat-dot" style="display:none;"></span>
            <div>
              <div id="active-chat-name" style="font-weight:700; font-size:16px;">Select a contact</div>
              <div id="active-chat-status" class="status-text">Search &amp; add a friend on the left to start</div>
            </div>
          </div>
        </div>

        <div class="messages-feed" id="messages-feed">
          <div class="empty-state">Pick a contact to send messages, photos, videos, or voice notes.</div>
        </div>

        <div class="emoji-bar" id="emoji-bar"></div>

        <div class="composer" id="composer" style="display:none;">
          <button id="emoji-toggle-btn" class="secondary icon-btn" type="button" title="Emojis">&#128512;</button>
          <button id="attach-btn" class="secondary icon-btn" type="button" title="Photo or Video">&#128206;</button>
          <input type="file" id="media-input" accept="image/*,video/*" style="display:none;" />
          <button id="record-btn" class="secondary icon-btn" type="button" title="Record Voice Note">&#127908;</button>
          <input type="text" id="msg-input" placeholder="Type a message..." />
          <button id="send-btn" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== 1) PASTE YOUR SUPABASE VALUES HERE ======
    // Supabase dashboard -> Project Settings -> API (or "Data API").
    // Use the Project URL and the *anon / publishable* key. Never the service_role key.
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    // Usernames are turned into this fake email for Supabase Auth.
    // If Supabase rejects it ("Email address ... is invalid"), type a real email
    // (like you@gmail.com) in the username box instead - that works too.
    const EMAIL_DOMAIN = "ankersoft.messenger";

    const configured =
      SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.includes("YOUR_");

    let sb = null;
    if (configured && window.supabase) {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.error("Supabase init failed:", err);
      }
    }

    let authMode = "login";
    let authBusy = false;
    let currentUser = null;
    let currentProfile = null;
    let contacts = [];
    let onlineUserIds = new Set();
    let activeContact = null;
    let mediaRecorder = null;
    let recordingTarget = null;
    let audioChunks = [];
    let isRecording = false;
    let bootedUserId = null;
    let chatToken = 0;
    let renderedIds = new Set();
    const pendingContactAdds = new Set();
    let searchTimer = null;
    let toastTimer = null;

    const QUICK_EMOJIS = [
      "\u{1F600}", "\u{1F602}", "\u{1F525}", "\u{1F44D}",
      "\u2764\uFE0F", "\u{1F62D}", "\u{1F60E}", "\u{1F3AE}",
      "\u{1F389}", "\u{1F4AF}", "\u{1F440}", "\u{1F64F}",
      "\u{1F680}", "\u{1F480}", "\u{1F914}", "\u{1F973}"
    ];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    function isSafeMediaUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url, window.location.origin);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch {
        return false;
      }
    }

    function notify(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = "none"; }, 6000);
    }

    function initEmojiBar() {
      const emojiBar = document.getElementById("emoji-bar");
      QUICK_EMOJIS.forEach((em) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "emoji-btn";
        btn.textContent = em;
        btn.addEventListener("click", () => {
          const input = document.getElementById("msg-input");
          input.value += em;
          input.focus();
        });
        emojiBar.appendChild(btn);
      });
    }

    function toggleEmojis() {
      document.getElementById("emoji-bar").classList.toggle("open");
    }

    // ---------- AUTH ----------

    function setAuthError(message, isInfo) {
      const el = document.getElementById("auth-error");
      el.textContent = message || "";
      el.className = isInfo ? "info" : "";
    }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("tab-login").className = mode === "login" ? "" : "secondary";
      document.getElementById("tab-signup").className = mode === "signup" ? "" : "secondary";
      document.getElementById("auth-submit").textContent = mode === "login" ? "Log In" : "Create Account";
      document.getElementById("auth-password").autocomplete =
        mode === "login" ? "current-password" : "new-password";
      setAuthError("");
    }

    function setAuthBusy(busy) {
      authBusy = busy;
      document.getElementById("auth-submit").disabled = busy;
    }

    // "ruzaib" -> ruzaib@ankersoft.messenger ; "me@gmail.com" -> used as-is
    function resolveIdentity(raw) {
      if (raw.includes("@")) {
        const email = raw.toLowerCase();
        const username = email.split("@")[0].replace(/[^a-z0-9_]/g, "");
        return { email, username };
      }
      const username = raw.toLowerCase().replace(/[^a-z0-9_]/g, "");
      return { email: `${username}@${EMAIL_DOMAIN}`, username };
    }

    function friendlyAuthError(error) {
      const m = (error.message || "").toLowerCase();
      if (m.includes("invalid login credentials")) {
        return "Wrong username or password. (If you just signed up, see the note about \"Confirm email\" in the setup steps.)";
      }
      if (m.includes("email not confirmed")) {
        return "This account is waiting for email confirmation. In Supabase go to Authentication > Sign In / Providers > Email and turn OFF \"Confirm email\", then sign up again with a new username.";
      }
      if (m.includes("already registered") || m.includes("already been registered")) {
        return "That username is already taken.";
      }
      if (m.includes("database error saving new user")) {
        return "That username is already taken (or the profiles table isn't set up yet).";
      }
      if (m.includes("is invalid") && m.includes("email")) {
        return "Supabase rejected the generated email address. Type a real email (like you@gmail.com) in the username box instead.";
      }
      if (m.includes("rate limit")) {
        return "Too many attempts. Wait a few minutes and try again.";
      }
      return error.message || "Something went wrong.";
    }

    async function handleAuth() {
      if (authBusy) return;

      if (!sb) {
        setAuthError("The app isn't connected to Supabase yet. Open index.html and paste your Supabase URL and anon key at the top of the script.");
        return;
      }

      const rawUser = document.getElementById("auth-username").value.trim();
      const password = document.getElementById("auth-password").value;
      setAuthError("");

      if (!rawUser || password.length < 6) {
        setAuthError("Enter a username and at least a 6-character password.");
        return;
      }

      const { email, username } = resolveIdentity(rawUser);
      if (!username) {
        setAuthError("Username can only contain letters, numbers, and underscores.");
        return;
      }

      setAuthBusy(true);
      try {
        if (authMode === "signup") {
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { username } }
          });
          if (error) {
            setAuthError(friendlyAuthError(error));
            return;
          }
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            setAuthError("That username is already taken.");
            return;
          }
          if (!data.session) {
            setAuthError("Account created, but Supabase is waiting for email confirmation, so you can't log in yet. Turn OFF \"Confirm email\" in Supabase (Authentication > Sign In / Providers > Email), then sign up again with a new username.", true);
          }
          // If a session exists, onAuthStateChange takes it from here.
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) setAuthError(friendlyAuthError(error));
        }
      } catch (err) {
        console.error(err);
        setAuthError("Couldn't reach Supabase. Check your internet connection and the URL/key at the top of the script.");
      } finally {
        setAuthBusy(false);
      }
    }

    async function logout() {
      try {
        await sb.auth.signOut();
      } finally {
        window.location.reload();
      }
    }

    // ---------- PROFILE / CONTACTS ----------

    async function ensureProfile(user) {
      const { data, error } = await sb
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (data) return data;
      if (error) console.error("Profile lookup failed:", error);

      const fallbackName =
        (user.user_metadata && user.user_metadata.username) ||
        (user.email || "user").split("@")[0];
      const row = { id: user.id, username: fallbackName };

      const { error: insErr } = await sb.from("profiles").insert(row);
      if (insErr) {
        console.error("Profile insert failed:", insErr);
        notify("Couldn't save your profile: " + insErr.message);
      }
      return row;
    }

    function renderContacts() {
      const list = document.getElementById("contacts-list");
      list.innerHTML = "";

      if (contacts.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:12px;">No contacts yet. Search a username above to add them!</div>';
        return;
      }

      contacts.forEach((c) => {
        const isOnline = onlineUserIds.has(c.id);
        const div = document.createElement("div");
        div.className = "contact-item" + (activeContact && activeContact.id === c.id ? " active" : "");
        div.addEventListener("click", () => {
          openChat(c);
        });
        div.innerHTML = `
          <div class="contact-left">
            <span class="status-dot ${isOnline ? "online" : ""}"></span>
            <div>
              <div style="font-weight:600;">${escapeHtml(c.username)}</div>
              <div class="status-text">${isOnline ? "Online" : "Offline"}</div>
            </div>
          </div>
        `;
        list.appendChild(div);
      });

      if (activeContact) {
        const isOnline = onlineUserIds.has(activeContact.id);
        document.getElementById("active-chat-dot").className = "status-dot " + (isOnline ? "online" : "");
        document.getElementById("active-chat-status").textContent = isOnline ? "Online now" : "Offline";
      }
    }

    async function loadContacts() {
      const { data: rows, error } = await sb
        .from("contacts")
        .select("contact_id")
        .eq("user_id", currentUser.id);

      if (error) {
        console.error("Loading contacts failed:", error);
        notify("Couldn't load contacts: " + error.message);
        return;
      }

      const ids = (rows || []).map((r) => r.contact_id);
      if (ids.length === 0) {
        contacts = [];
        renderContacts();
        return;
      }

      const { data: profs, error: profErr } = await sb
        .from("profiles")
        .select("id, username")
        .in("id", ids)
        .order("username");

      if (profErr) {
        console.error("Loading contact profiles failed:", profErr);
        notify("Couldn't load contacts: " + profErr.message);
        return;
      }

      contacts = profs || [];
      renderContacts();
    }

    async function addContact(user) {
      const { error } = await sb
        .from("contacts")
        .insert({ user_id: currentUser.id, contact_id: user.id });

      // 23505 = already in your contacts, which is fine
      if (error && error.code !== "23505") {
        console.error("Adding contact failed:", error);
        notify("Couldn't add contact: " + error.message);
        return;
      }

      document.getElementById("search-input").value = "";
      document.getElementById("search-results-section").style.display = "none";
      await loadContacts();
      await openChat(user);
    }

    async function searchUsers() {
      const query = document.getElementById("search-input").value.trim();
      const section = document.getElementById("search-results-section");
      const resultsList = document.getElementById("search-results-list");

      if (!query) {
        section.style.display = "none";
        return;
      }

      const { data, error } = await sb
        .from("profiles")
        .select("id, username")
        .ilike("username", `%${query}%`)
        .neq("id", currentUser.id)
        .limit(8);

      if (error) {
        console.error("Search failed:", error);
        notify("Search failed: " + error.message);
        return;
      }

      // Ignore stale results if the box changed while we were waiting
      if (document.getElementById("search-input").value.trim() !== query) return;

      section.style.display = "block";
      resultsList.innerHTML = "";

      if (!data || data.length === 0) {
        resultsList.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:8px;">No users found.</div>';
        return;
      }

      data.forEach((user) => {
        const alreadyAdded = contacts.some((c) => c.id === user.id);
        const div = document.createElement("div");
        div.className = "contact-item";

        const nameSpan = document.createElement("span");
        nameSpan.textContent = user.username;

        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.style.padding = "4px 10px";
        addBtn.style.fontSize = "12px";
        addBtn.style.minHeight = "30px";
        addBtn.disabled = alreadyAdded;
        addBtn.textContent = alreadyAdded ? "Added" : "+ Add";

        if (!alreadyAdded) {
          addBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await addContact(user);
          });
        }

        div.appendChild(nameSpan);
        div.appendChild(addBtn);
        resultsList.appendChild(div);
      });
    }

    // ---------- MESSAGES ----------

    function appendMessageToFeed(msg) {
      if (msg.id) {
        if (renderedIds.has(msg.id)) return;
        renderedIds.add(msg.id);
      }

      const placeholder = document.getElementById("no-msg-placeholder");
      if (placeholder) placeholder.remove();

      const feed = document.getElementById("messages-feed");
      const isMine = msg.sender_id === currentUser.id;
      const div = document.createElement("div");
      div.className = "msg-bubble " + (isMine ? "msg-mine" : "msg-theirs");

      if (msg.content) {
        const text = document.createElement("div");
        text.textContent = msg.content;
        div.appendChild(text);
      }

      // Media is built with DOM properties (not innerHTML) so a crafted URL can't inject HTML.
      if (isSafeMediaUrl(msg.media_url)) {
        const wrap = document.createElement("div");
        wrap.className = "msg-media";
        let el = null;

        if (msg.media_type === "image") {
          el = document.createElement("img");
          el.alt = "Shared image";
        } else if (msg.media_type === "video") {
          el = document.createElement("video");
          el.controls = true;
          el.playsInline = true;
        } else if (msg.media_type === "audio") {
          el = document.createElement("audio");
          el.controls = true;
        }

        if (el) {
          el.src = msg.media_url;
          wrap.appendChild(el);
          div.appendChild(wrap);
        }
      }

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = new Date(msg.created_at).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
      div.appendChild(time);

      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }

    async function openChat(contact) {
      const token = ++chatToken;
      activeContact = contact;
      renderedIds = new Set();
      document.getElementById("main-layout").classList.add("in-chat");
      document.getElementById("active-chat-name").textContent = contact.username;
      document.getElementById("active-chat-dot").style.display = "inline-block";
      document.getElementById("composer").style.display = "flex";
      renderContacts();

      const feed = document.getElementById("messages-feed");
      feed.innerHTML = '<div class="empty-state">Loading chat...</div>';

      const { data, error } = await sb
        .from("messages")
        .select("*")
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${contact.id}),and(sender_id.eq.${contact.id},receiver_id.eq.${currentUser.id})`
        )
        .order("created_at", { ascending: true });

      if (token !== chatToken) return; // user switched chats while loading

      feed.innerHTML = "";
      if (error) {
        console.error("Loading messages failed:", error);
        feed.innerHTML = '<div class="empty-state">Couldn\'t load messages.</div>';
        notify("Couldn't load messages: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        feed.innerHTML = `<div class="empty-state" id="no-msg-placeholder">Say hello to ${escapeHtml(contact.username)}!</div>`;
      } else {
        data.forEach(appendMessageToFeed);
      }
    }

    function closeMobileChat() {
      document.getElementById("main-layout").classList.remove("in-chat");
      activeContact = null;
      chatToken++;
    }

    async function insertMessage(receiverId, fields) {
      const { data, error } = await sb
        .from("messages")
        .insert({ sender_id: currentUser.id, receiver_id: receiverId, ...fields })
        .select()
        .single();

      if (error) throw error;

      // Show it right away; realtime will also deliver it, and renderedIds de-dupes.
      if (data && activeContact && activeContact.id === receiverId) {
        appendMessageToFeed(data);
      }
      return data;
    }

    async function sendTextMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !activeContact) return;

      input.value = "";
      document.getElementById("emoji-bar").classList.remove("open");

      try {
        await insertMessage(activeContact.id, { content: text, media_type: "text" });
      } catch (err) {
        console.error("Send failed:", err);
        input.value = text;
        notify("Message not sent: " + err.message);
      }
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      const target = activeContact;
      if (!file || !target) return;

      try {
        if (file.size > 50 * 1024 * 1024) {
          window.alert("Please select an image or video smaller than 50 MB.");
          return;
        }

        const mediaType = file.type.startsWith("video/") ? "video" : "image";
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "") || "upload";
        const filePath = `${currentUser.id}/${Date.now()}_${safeName}`;

        const { error } = await sb.storage.from("chat-media").upload(filePath, file);
        if (error) {
          window.alert(`Upload failed: ${error.message}`);
          return;
        }

        const { data: urlData } = sb.storage.from("chat-media").getPublicUrl(filePath);
        await insertMessage(target.id, {
          media_url: urlData.publicUrl,
          media_type: mediaType
        });
      } catch (err) {
        console.error("Media send failed:", err);
        notify("Couldn't send file: " + err.message);
      } finally {
        event.target.value = "";
      }
    }

    async function toggleVoiceRecord() {
      const btn = document.getElementById("record-btn");

      if (!isRecording) {
        if (!activeContact) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          recordingTarget = activeContact;
          audioChunks = [];

          mediaRecorder.addEventListener("dataavailable", (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          });

          mediaRecorder.addEventListener("stop", async () => {
            stream.getTracks().forEach((t) => t.stop());
            const target = recordingTarget;
            const mimeType = mediaRecorder.mimeType || "audio/mp4";
            const ext = mimeType.includes("webm") ? "webm" : "mp4";
            const blob = new Blob(audioChunks, { type: mimeType });
            const filePath = `${currentUser.id}/voice_${Date.now()}.${ext}`;

            try {
              const { error } = await sb.storage
                .from("chat-media")
                .upload(filePath, blob, { contentType: mimeType });
              if (error) throw error;

              if (target) {
                const { data: urlData } = sb.storage.from("chat-media").getPublicUrl(filePath);
                await insertMessage(target.id, {
                  media_url: urlData.publicUrl,
                  media_type: "audio"
                });
              }
            } catch (err) {
              console.error("Voice note failed:", err);
              notify("Voice note not sent: " + err.message);
            }
          });

          mediaRecorder.start();
          isRecording = true;
          btn.classList.add("recording");
          btn.textContent = "\u23F9\uFE0F";
        } catch {
          window.alert("Microphone access denied or unavailable on this browser.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove("recording");
        btn.innerHTML = "&#127908;";
      }
    }

    // ---------- REALTIME + PRESENCE ----------

    async function ensureContactFromIncoming(senderId) {
      if (contacts.some((c) => c.id === senderId) || pendingContactAdds.has(senderId)) return;
      pendingContactAdds.add(senderId);
      try {
        const { error } = await sb
          .from("contacts")
          .insert({ user_id: currentUser.id, contact_id: senderId });
        if (error && error.code !== "23505") console.error("Auto-add contact failed:", error);
        await loadContacts();
      } finally {
        pendingContactAdds.delete(senderId);
      }
    }

    function setupRealtimeAndPresence() {
      const presenceChannel = sb.channel("ankersoft-online-users", {
        config: { presence: { key: currentUser.id } }
      });

      presenceChannel
        .on("presence", { event: "sync" }, () => {
          const state = presenceChannel.presenceState();
          onlineUserIds = new Set(Object.keys(state));
          renderContacts();
        })
        .subscribe(async (status) => {
          if (status === "SUBSCRIBED") {
            await presenceChannel.track({
              username: currentProfile.username,
              online_at: new Date().toISOString()
            });
          }
        });

      sb.channel("ankersoft-messages")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "messages" },
          async (payload) => {
            const msg = payload.new;
            const involvesMe = msg.sender_id === currentUser.id || msg.receiver_id === currentUser.id;
            if (!involvesMe) return;

            if (msg.sender_id !== currentUser.id) {
              await ensureContactFromIncoming(msg.sender_id);
            }

            if (
              activeContact &&
              (msg.sender_id === activeContact.id || msg.receiver_id === activeContact.id)
            ) {
              appendMessageToFeed(msg);
            }
          }
        )
        .subscribe();
    }

    // ---------- STARTUP ----------

    async function bootApp(user) {
      currentUser = user;
      currentProfile = await ensureProfile(user);

      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("current-user-label").textContent = `@${currentProfile.username}`;

      await loadContacts();
      setupRealtimeAndPresence();
    }

    // Runs once per signed-in user. supabase-js fires SIGNED_IN / TOKEN_REFRESHED again
    // (e.g. whenever the tab regains focus), which would otherwise duplicate every listener.
    function startApp(user) {
      if (bootedUserId === user.id) return;
      bootedUserId = user.id;
      // setTimeout(0) matters: awaiting Supabase calls directly inside onAuthStateChange can
      // deadlock supabase-js, which is the "login hangs forever" bug.
      setTimeout(() => {
        bootApp(user).catch((err) => {
          console.error("Startup failed:", err);
          notify("Something went wrong loading your account: " + err.message);
        });
      }, 0);
    }

    function wireUpUi() {
      initEmojiBar();
      document.getElementById("tab-login").addEventListener("click", () => setAuthMode("login"));
      document.getElementById("tab-signup").addEventListener("click", () => setAuthMode("signup"));
      document.getElementById("auth-submit").addEventListener("click", handleAuth);
      ["auth-username", "auth-password"].forEach((id) => {
        document.getElementById(id).addEventListener("keydown", (event) => {
          if (event.key === "Enter") handleAuth();
        });
      });
      document.getElementById("logout-btn").addEventListener("click", logout);
      document.getElementById("search-input").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(searchUsers, 250);
      });
      document.getElementById("back-btn").addEventListener("click", closeMobileChat);
      document.getElementById("emoji-toggle-btn").addEventListener("click", toggleEmojis);
      document.getElementById("attach-btn").addEventListener("click", () => {
        document.getElementById("media-input").click();
      });
      document.getElementById("media-input").addEventListener("change", handleFileUpload);
      document.getElementById("record-btn").addEventListener("click", toggleVoiceRecord);
      document.getElementById("send-btn").addEventListener("click", sendTextMessage);
      document.getElementById("msg-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendTextMessage();
      });
    }

    // UI is wired first so the buttons always respond, even if Supabase isn't configured.
    wireUpUi();

    if (!sb) {
      setAuthError(
        window.supabase
          ? "Not connected: open index.html and paste your Supabase URL and anon key at the top of the script."
          : "Couldn't load the Supabase library. Check your internet connection and reload."
      );
    } else {
      sb.auth.onAuthStateChange((event, session) => {
        if (session && session.user) startApp(session.user);
      });
      sb.auth.getSession().then(({ data }) => {
        if (data && data.session) startApp(data.session.user);
      });
    }
  </script>
</body>
